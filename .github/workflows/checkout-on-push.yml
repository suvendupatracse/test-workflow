name: test dev

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: Select the environment
        type: choice
        required: true
        options:
          - dev
          - qa
          - prod

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

  approval:
    needs: checkout
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      DOOM: ${{ vars.DOOM }}
    steps:
      - name: Continue after approval
        run: echo "Approval granted for ${{ inputs.environment || 'dev' }}"
      - name: Print DOOM
        run: echo "DOOM=$DOOM"

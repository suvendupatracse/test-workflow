name: test dev

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Select the environment
        type: choice
        required: true
        options:
          - dev
          - qa

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

  approval:
    needs: checkout
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Continue after approval
        run: echo "Approval granted for ${{ inputs.environment || 'dev' }}"